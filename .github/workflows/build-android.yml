name: Build Android APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build APK
        run: dotnet publish src/VibeR/VibeR.fsproj -f net8.0-android -c Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeR-apk
          path: src/VibeR/bin/Release/net8.0-android/publish/*.apk
